<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="1600" height="1600" role="img" aria-label="Atom DPI Bypass">
  <title>Atom DPI Bypass</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25CBEF"/>
      <stop offset="1" stop-color="#398AF5"/>
    </linearGradient>
    <linearGradient id="flow" x1="343" y1="0" x2="1290" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25CBEF"/>
      <stop offset="1" stop-color="#398AF5"/>
    </linearGradient>
    <clipPath id="shield">
      <path d="M800 123 L1349 323 L1349 880 C1349 1163 1121 1364 800 1475 C479 1364 251 1163 251 880 L251 323 Z"/>
    </clipPath>
  </defs>

  <!-- shield body -->
  <path d="M800 123 L1349 323 L1349 880 C1349 1163 1121 1364 800 1475 C479 1364 251 1163 251 880 L251 323 Z" fill="#111C2E"/>

  <g clip-path="url(#shield)">
    <!-- packet stream: top row -->
    <rect x="343" y="593" width="338" height="63" rx="31.5" fill="url(#flow)"/>
    <rect x="918" y="593" width="338" height="63" rx="31.5" fill="url(#flow)"/>
    <!-- packet stream: bottom row -->
    <rect x="343" y="943" width="338" height="63" rx="31.5" fill="url(#flow)"/>
    <rect x="918" y="943" width="338" height="63" rx="31.5" fill="url(#flow)"/>

    <!-- the block -->
    <rect x="738" y="469" width="123" height="662" rx="26" fill="#CE3E42"/>

    <!-- the packet that gets through -->
    <rect x="343" y="768" width="913" height="63" rx="31.5" fill="url(#flow)"/>
    <path d="M1160 718 L1290 799.5 L1160 881 Z" fill="#398AF5" stroke="#398AF5" stroke-width="26" stroke-linejoin="round"/>
  </g>

  <!-- shield edge -->
  <path d="M800 123 L1349 323 L1349 880 C1349 1163 1121 1364 800 1475 C479 1364 251 1163 251 880 L251 323 Z"
        fill="none" stroke="url(#edge)" stroke-width="45" stroke-linejoin="round"/>
</svg>
