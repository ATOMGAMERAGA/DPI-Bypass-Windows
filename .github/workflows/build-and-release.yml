name: build-and-release

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          # major.minor.patch is configured in Directory.Build.props; the CI run number
          # makes every merge to main a distinct, ordered release.
          [xml]$props = Get-Content Directory.Build.props
          $prefix = $props.Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          if (-not $prefix) { throw 'VersionPrefix not found in Directory.Build.props' }
          $full = "$prefix.${{ github.run_number }}"
          "prefix=$prefix"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "full=$full"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$full"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $full"

      - name: Fetch the WinDivert driver payload
        shell: pwsh
        run: ./tools/fetch-windivert.ps1

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src/DpiBypass.Core/DpiBypass.Core.csproj
          dotnet restore src/DpiBypass.App/DpiBypass.App.csproj
          dotnet restore tests/DpiBypass.Tests/DpiBypass.Tests.csproj

      - name: Run the unit tests
        shell: pwsh
        run: >
          dotnet test tests/DpiBypass.Tests/DpiBypass.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results

      - name: Run the script and resource tests
        shell: pwsh
        run: |
          # The install script decides whether a machine gets updated at all, and a
          # XAML key that does not resolve takes the window down before anyone sees
          # it. Neither is covered by the C# tests.
          $tests = @(Get-ChildItem scripts/tests -Filter '*.tests.ps1' | Sort-Object Name)
          if ($tests.Count -eq 0) { throw 'No script tests were found.' }

          foreach ($test in $tests) {
            Write-Host "--- $($test.Name)"

            # Cleared first: a script that ends without exiting would otherwise be
            # judged by the exit code of whatever ran before it.
            $global:LASTEXITCODE = 0
            & $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($test.Name) failed" }
          }

      - name: Publish the application
        shell: pwsh
        run: >
          dotnet publish src/DpiBypass.App/DpiBypass.App.csproj
          --configuration Release
          --output artifacts/publish
          -p:Version=${{ steps.version.outputs.full }}
          -p:FileVersion=${{ steps.version.outputs.full }}
          -p:AssemblyVersion=${{ steps.version.outputs.full }}
          -p:InformationalVersion=${{ steps.version.outputs.full }}

      - name: Check the payload is complete
        shell: pwsh
        run: |
          $required = @('DpiBypass.exe', 'DpiBypass.Recovery.exe', 'DpiBypass.Core.dll', 'WinDivert.dll', 'WinDivert64.sys')
          $missing = @()
          foreach ($name in $required) {
            if (-not (Test-Path "artifacts/publish/$name")) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            throw "Publish output is missing: $($missing -join ', ')"
          }
          # A driver that is not validly signed will not load, so fail here rather
          # than shipping an installer that cannot start the engine. Only the .sys is
          # checked: upstream does not sign the user mode DLL, and the loader does not
          # require it to be signed.
          $signature = Get-AuthenticodeSignature 'artifacts/publish/WinDivert64.sys'
          if ($signature.Status -ne 'Valid') {
            throw "WinDivert64.sys signature is $($signature.Status)"
          }
          Write-Host 'Publish output verified.'

      - name: Smoke-test the real WPF window
        shell: pwsh
        run: |
          # Compiling BAML and checking resource names is not enough: WPF resolves
          # templates and StaticResource references while InitializeComponent runs.
          # Launch the published executable on the Windows runner and require a real
          # first frame before an installer containing it is allowed to ship.
          $publish = (Resolve-Path 'artifacts/publish').Path
          $exe = Join-Path $publish 'DpiBypass.exe'
          $process = Start-Process -FilePath $exe `
                                   -ArgumentList '--ui-selftest' `
                                   -WorkingDirectory $publish `
                                   -PassThru

          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'The WPF window self-test did not finish within 60 seconds.'
          }

          if ($process.ExitCode -ne 0) {
            $logs = Join-Path $env:ProgramData 'DPI Bypass\logs'
            Write-Host "WPF self-test failed with exit code $($process.ExitCode)."
            if (Test-Path $logs) {
              Get-ChildItem $logs -File | Sort-Object LastWriteTime | ForEach-Object {
                Write-Host "--- $($_.FullName)"
                Get-Content $_.FullName -Tail 200
              }
            }
            throw 'The published application could not render its main window.'
          }

          Write-Host 'Published WPF window rendered successfully.'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.full }}" `
                  "/DPublishDir=..\artifacts\publish" `
                  installer\DpiBypass.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - name: Package the portable build and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null

          $setup = Get-ChildItem installer/output -Filter 'DpiBypass-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer was not produced.' }
          Copy-Item $setup.FullName artifacts/release/

          $zip = "artifacts/release/DpiBypass-Portable-${{ steps.version.outputs.full }}.zip"
          Compress-Archive -Path 'artifacts/publish/*' -DestinationPath $zip -CompressionLevel Optimal

          $lines = foreach ($file in Get-ChildItem artifacts/release -File) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $($file.Name)"
          }
          $lines | Set-Content -Path 'artifacts/release/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'artifacts/release/SHA256SUMS.txt' | Write-Host

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dpibypass-${{ steps.version.outputs.full }}
          path: |
            artifacts/release/*
            artifacts/test-results/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          # PowerShell 7.4 turns a non-zero exit from a native command into a
          # terminating error, which would take the retry loops below out of the
          # picture entirely - the first failed upload would end the step instead of
          # being retried. Exit codes are checked by hand here.
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = '${{ steps.version.outputs.tag }}'
          $repo = '${{ github.repository }}'

          # A run that dies partway through uploading assets leaves a draft release
          # behind, and a draft is invisible to "releases/latest" - so every user
          # running the install command keeps getting the version before it, which is
          # exactly how a fixed build fails to reach anybody. Clear ours out first.
          $existingJson = gh api "repos/$repo/releases?per_page=100"
          $existing = @()
          if ($LASTEXITCODE -eq 0 -and $existingJson) { $existing = $existingJson | ConvertFrom-Json }

          foreach ($candidate in $existing) {
            if ($candidate.draft -and ($candidate.name -like 'DPI Bypass*' -or $candidate.tag_name -like 'v*')) {
              Write-Host "Removing stale draft release: $($candidate.name) [$($candidate.tag_name)]"
              gh api -X DELETE "repos/$repo/releases/$($candidate.id)" | Out-Null
            }
          }

          # Single quoted here-string: the notes contain markdown backticks, and in a
          # double quoted one PowerShell would treat each of them as an escape.
          $notes = @'
          ## DPI Bypass ${{ steps.version.outputs.full }}

          Türkiye'deki DPI engellerini aşan Windows uygulaması. Discord başta olmak
          üzere HTTPS/HTTP bağlantılarını, ping ve ses trafiğine dokunmadan korur.

          ### Kurulum ve güncelleme

          Tek satırlık kurulum (PowerShell):

          ```powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
          ```

          Aynı komut güncelleme komutudur: yeni sürüm varsa eski kurulumu kaldırıp
          yenisini kurar, en güncel sürüm zaten kuruluysa bunu söyleyip çıkar.

          Ya da aşağıdaki `DpiBypass-Setup-${{ steps.version.outputs.full }}.exe`
          dosyasını indirip çalıştırın.

          ### Bu sürümde

          - 14 atlatma yöntemi; ağa göre en hızlısı gerçek bağlantı testleriyle ölçülerek seçilir.
          - Ağ değiştiğinde çalışan yöntem arka planda yeniden bulunur, düzenli denetimle doğrulanır.
          - Yeni engelli siteler kendiliğinden ölçülüp listeye eklenir; liste arayüzden düzenlenebilir.
          - Mobil hotspot uyumluluğu ve tanılama: IPv4/IPv6, DNS, RTT, kayıp, MTU ve operatör NAT'ı kontrolü — hiçbir şeyi değiştirmeden.
          - Beta Ping Düşürme: eşli A/B turlarıyla median/p95/p99/jitter ölçer; kazanç tekrarlanmazsa ayarı geri alır.
          - Şifreli DNS: Cloudflare birincil, Google ve Quad9 yedek.
          - Kapsam seçimi: yalnızca Discord, engelli site listesi, + tarayıcılar veya tüm sistem.
          - Her Windows açılışında yükseltilmiş oturum açma göreviyle başlar.
          - Kaldırma sırasında özgün NIC ve DNS ayarları geri yüklenir.

          Derleme: `${{ github.sha }}`
          '@

          $release = $null
          $releaseJson = gh api "repos/$repo/releases/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0 -and $releaseJson) { $release = $releaseJson | ConvertFrom-Json }

          if (-not $release) {
            # Created empty, then filled: an asset upload that fails is retried below
            # rather than taking the whole release down with it.
            gh release create $tag --title "DPI Bypass ${{ steps.version.outputs.full }}" --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not create the release $tag" }
          }
          else {
            Write-Host "Release $tag already exists; uploading into it."
          }

          $files = Get-ChildItem artifacts/release -File
          foreach ($file in $files) {
            $uploaded = $false

            # The uploads endpoint answers 404 or 5xx under load often enough that a
            # single attempt is not a release process. Four tries, backing off.
            for ($attempt = 1; $attempt -le 4 -and -not $uploaded; $attempt++) {
              Write-Host "Uploading $($file.Name) (attempt $attempt)..."
              gh release upload $tag $file.FullName --clobber
              if ($LASTEXITCODE -eq 0) {
                $uploaded = $true
              }
              else {
                Start-Sleep -Seconds (10 * $attempt)
              }
            }

            if (-not $uploaded) { throw "Could not upload $($file.Name) to $tag" }
          }

          # The install command reads this list, so a release missing the installer is
          # worse than no release at all: it is an update everyone downloads and none
          # of them can install.
          $publishedJson = gh api "repos/$repo/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0 -or -not $publishedJson) { throw "Release $tag could not be read back" }

          $published = $publishedJson | ConvertFrom-Json
          $names = @($published.assets | ForEach-Object { $_.name })
          foreach ($file in $files) {
            if ($names -notcontains $file.Name) { throw "$($file.Name) is missing from the published release" }
          }

          if ($published.draft) { throw "Release $tag is still a draft" }

          Write-Host "Published $tag with $($names.Count) assets: $($names -join ', ')"
